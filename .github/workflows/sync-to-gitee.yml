name: Sync to Gitee

# GitHub 为主仓，Gitee 只读镜像：push 代码自动镜像，发布/编辑 Release 自动同步。
# 同步内容：tag、标题、说明正文、预发布标记、附件（与 GitHub 同名同大小的文件跳过不重传）。
# 需要在 GitHub 仓库 Settings > Secrets and variables > Actions 中添加：
#   GITEE_PRIVATE_TOKEN = Gitee 私人令牌（需 projects 权限）

on:
  push:
    branches: [master]
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  mirror-code:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push branches and tags to Gitee
        run: |
          git remote add gitee "https://oauth2:${GITEE_PRIVATE_TOKEN}@gitee.com/${{ github.repository }}.git"
          git push gitee --all
          git push gitee --tags
        env:
          GITEE_PRIVATE_TOKEN: ${{ secrets.GITEE_PRIVATE_TOKEN }}

  sync-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push tags to Gitee first
        run: |
          git remote add gitee "https://oauth2:${GITEE_PRIVATE_TOKEN}@gitee.com/${{ github.repository }}.git"
          git push gitee --all
          git push gitee --tags
        env:
          GITEE_PRIVATE_TOKEN: ${{ secrets.GITEE_PRIVATE_TOKEN }}
      - name: Sync release to Gitee (create or update)
        run: |
          API="https://gitee.com/api/v5/repos/${OWNER_REPO}"
          [ -z "$REL_NAME" ] && REL_NAME="$REL_TAG"
          [ "$REL_PRE" = "true" ] || REL_PRE="false"
          NOTES_FILE="$(mktemp)"
          printf '%s' "$REL_BODY" > "$NOTES_FILE"
          PAYLOAD="$(jq -n --arg tag "$REL_TAG" --arg name "$REL_NAME" --arg body "$(cat "$NOTES_FILE")" --argjson pre "$REL_PRE" '{tag_name:$tag,name:$name,body:$body,target_commitish:$tag,prerelease:$pre}')"
          echo "$PAYLOAD" | grep -q '"name"' || { echo 'bad payload'; exit 1; }
          RID="$(curl -sS "${API}/releases/tags/${REL_TAG}?access_token=${GITEE_PRIVATE_TOKEN}" | jq -r '.id // empty')"
          if [ -z "$RID" ]; then
            RID="$(curl -sS --fail -X POST "${API}/releases?access_token=${GITEE_PRIVATE_TOKEN}" -H 'Content-Type: application/json' -d "$PAYLOAD" | jq -r .id)"
            echo "Created Gitee release id: $RID"
          else
            curl -sS --fail -X PATCH "${API}/releases/${RID}?access_token=${GITEE_PRIVATE_TOKEN}" -H 'Content-Type: application/json' -d "$PAYLOAD" > /dev/null
            echo "Updated Gitee release id: $RID"
          fi
          case "$RID" in ''|null) echo 'no release id, abort'; exit 1;; esac
          mkdir -p assets
          COUNT="$(gh release view "$REL_TAG" --repo "$OWNER_REPO" --json assets --jq '.assets | length')"
          if [ "$COUNT" != "0" ]; then
            gh release download "$REL_TAG" --dir assets --repo "$OWNER_REPO"
          else
            echo "No assets on GitHub release, skip download"
          fi
          EXISTING="$(curl -sS "${API}/releases/${RID}?access_token=${GITEE_PRIVATE_TOKEN}" | jq -r '.assets[] | "\(.name)|\(.size // "")"')"
          for f in assets/*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            size="$(wc -c < "$f" | tr -d ' ')"
            info="$(echo "$EXISTING" | grep -F "${base}|" || true)"
            if [ -n "$info" ]; then
              esize="$(echo "$info" | cut -d'|' -f2)"
              if [ -z "$esize" ] || [ "$esize" = "$size" ]; then
                echo "Skip existing $base"
                continue
              fi
            fi
            echo "Uploading $base"
            curl -sS --fail -X POST "${API}/releases/${RID}/attach_files?access_token=${GITEE_PRIVATE_TOKEN}" -F "file=@$f"
            echo
          done
        env:
          GITEE_PRIVATE_TOKEN: ${{ secrets.GITEE_PRIVATE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REL_NAME: ${{ github.event.release.name }}
          REL_BODY: ${{ github.event.release.body }}
          REL_PRE: ${{ github.event.release.prerelease }}
